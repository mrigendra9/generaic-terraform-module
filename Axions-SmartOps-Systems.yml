pool:
  name: Managed-Agent01

trigger:
- feature/*
- main

stages:
- stage: TerraformInit
  displayName: Terraform_Init
  jobs:
    - job: TerraformInit
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environments/Development/'
          backendServiceArm: 'az-ado-sandbox-sc'
          backendAzureRmOverrideSubscriptionID: '9ae61928-2a87-4dc8-a352-004f5b5e3ebf'
          backendAzureRmResourceGroupName: 'rg-tfstate-stg'
          backendAzureRmStorageAccountName: 'tfstatestgaccount01'
          backendAzureRmContainerName: 'tfstate-development'
          backendAzureRmKey: 'development.tfstate'

- stage: TerraformValidate
  displayName: Terraform_Validate
  condition: succeeded()
  dependsOn: TerraformInit
  pool: Managed-Agent02
  jobs:
    - job: TerraformValidate
      steps:         
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environments/Development/'
          backendServiceArm: 'az-ado-sandbox-sc'
          backendAzureRmOverrideSubscriptionID: '9ae61928-2a87-4dc8-a352-004f5b5e3ebf'
          backendAzureRmResourceGroupName: 'rg-tfstate-stg'
          backendAzureRmStorageAccountName: 'tfstatestgaccount01'
          backendAzureRmContainerName: 'tfstate-development'
          backendAzureRmKey: 'development.tfstate'
      - task: TerraformTask@5
        inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environments/Development/'

- stage: TerraformPlan
  displayName: Terraform_Plan
  condition: succeeded()
  dependsOn: TerraformValidate
  jobs:
    - job: TerraformPlan
      pool: Managed-Agent01
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environments/Development/'
          backendServiceArm: 'az-ado-sandbox-sc'
          backendAzureRmOverrideSubscriptionID: '9ae61928-2a87-4dc8-a352-004f5b5e3ebf'
          backendAzureRmResourceGroupName: 'rg-tfstate-stg'
          backendAzureRmStorageAccountName: 'tfstatestgaccount01'
          backendAzureRmContainerName: 'tfstate-development'
          backendAzureRmKey: 'development.tfstate'
      - task: TerraformTask@5
        inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environments/Development/'
            environmentServiceNameAzureRM: 'az-ado-sandbox-sc'
            environmentAzureRmOverrideSubscriptionID: '9ae61928-2a87-4dc8-a352-004f5b5e3ebf'

- stage: TerraformApply
  displayName: Terraform_Apply
  # condition: succeeded()
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  dependsOn: TerraformPlan
  jobs:
    - job: ManualValidation
      displayName: ManualValidation
      pool: server
      steps:
      - task: ManualValidation@1
        inputs:
          notifyUsers: 'mrigendra.k@outlook.com'
    - job: 
      pool: Managed-Agent02
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environments/Development/'
          backendServiceArm: 'az-ado-sandbox-sc'
          backendAzureRmOverrideSubscriptionID: '9ae61928-2a87-4dc8-a352-004f5b5e3ebf'
          backendAzureRmResourceGroupName: 'rg-tfstate-stg'
          backendAzureRmStorageAccountName: 'tfstatestgaccount01'
          backendAzureRmContainerName: 'tfstate-development'
          backendAzureRmKey: 'development.tfstate'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'apply'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environments/Development/'
          environmentServiceNameAzureRM: 'az-ado-sandbox-sc'
          environmentAzureRmOverrideSubscriptionID: '9ae61928-2a87-4dc8-a352-004f5b5e3ebf'
      